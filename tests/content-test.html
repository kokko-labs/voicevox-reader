<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>VOICEVOX Reader Content Tests</title>
  <link rel="stylesheet" href="../src/content/content.css">
</head>
<body>
  <main id="fixture"></main>
  <pre id="result">running</pre>

  <script>
    window.__VOICEVOX_READER_ENABLE_TEST_HOOKS__ = true;
    window.alert = (message) => {
      throw new Error(`Unexpected alert: ${message}`);
    };
    window.confirm = () => {
      throw new Error('Unexpected confirm');
    };
    window.__statusMessages = [];
    // VOICEVOX の起動状態をテストから切り替えられるようにする
    window.__voicevoxAvailable = true;
    // chrome.storage.local の中身と、登録された onChanged リスナー
    window.__storedSettings = { floatingPanelEnabled: false };
    window.__storageListeners = [];
    // content が送ったメッセージの種類を記録する
    window.__sentActions = [];

    // jsdom には音声合成が無いので、OS標準の音声を模したものを用意する
    window.__systemSpoken = [];
    window.SpeechSynthesisUtterance = function (text) {
      this.text = text;
      this.onend = null;
      this.onerror = null;
    };
    window.speechSynthesis = {
      getVoices: () => [{ voiceURI: 'TestVoice', name: 'Test Voice', lang: 'en-US' }],
      speak(utterance) {
        window.__systemSpoken.push(utterance.text);
        setTimeout(() => { if (utterance.onend) { utterance.onend(); } }, 0);
      },
      cancel() {},
      pause() {},
      resume() {}
    };
    window.chrome = {
      runtime: {
        onMessage: { addListener() {} },
        sendMessage(message) {
          window.__sentActions.push(message.action);
          if (message.action === 'checkVoicevoxStatus') {
            return Promise.resolve({ success: true, available: window.__voicevoxAvailable });
          }
          if (message.action === 'statusUpdate') {
            window.__statusMessages.push({
              currentIndex: message.currentIndex,
              totalSentences: message.totalSentences,
              isPlaying: message.isPlaying,
              isPaused: message.isPaused
            });
            return Promise.resolve({ success: true });
          }
          if (message.action === 'updateIcon') {
            return Promise.resolve({ success: true });
          }
          return Promise.resolve({ success: true });
        }
      },
      storage: {
        onChanged: {
          addListener(listener) {
            window.__storageListeners.push(listener);
          }
        },
        local: {
          get(keys, callback) {
            const value = { ...window.__storedSettings };
            if (typeof callback === 'function') {
              callback(value);
            }
            return Promise.resolve(value);
          },
          set(values, callback) {
            Object.assign(window.__storedSettings, values);
            if (typeof callback === 'function') {
              callback();
            }
            return Promise.resolve();
          }
        }
      }
    };
  </script>
  <script src="../src/content/content.js"></script>
  <script>
    const tests = [];
    const api = window.__VOICEVOX_READER_TESTS__;
    const result = document.getElementById('result');
    const fixture = document.getElementById('fixture');

    function test(name, fn) {
      tests.push({ name, fn });
    }

    function assert(condition, message) {
      if (!condition) {
        throw new Error(message);
      }
    }

    function setFixture(html) {
      api.stopReading();
      api.hideFloatingPanel();
      api.setSpeaker(null);
      fixture.innerHTML = html;
      window.__voicevoxAvailable = true;
      // 声の指定も既定へ戻す。前のテストの選択が残ると方式がずれる
      window.__storedSettings = { floatingPanelEnabled: false, voice: 'voicevox:0' };
      const selection = window.getSelection();
      if (selection) {
        selection.removeAllRanges();
      }
      const notice = document.getElementById('voicevox-reader-notice');
      if (notice) {
        notice.remove();
      }
    }

    function compact(text) {
      return text.replace(/\s+/g, '');
    }

    test('HTML解析で本文を優先し、ナビゲーションを除外する', () => {
      setFixture(`
        <nav>ホーム メニュー 読まない</nav>
        <article>
          <h1>テスト記事</h1>
          <p>これは本文の一段落目です。重要な説明があります。</p>
          <p>これは本文の二段落目です。読み上げ対象です。</p>
        </article>
        <aside>広告と関連記事</aside>
      `);

      const text = api.extractMainContent();
      assert(text.includes('これは本文の一段落目です。'), '本文の一段落目が抽出されていません');
      assert(text.includes('これは本文の二段落目です。'), '本文の二段落目が抽出されていません');
      assert(!text.includes('ホーム メニュー'), 'ナビゲーションが混入しています');
      assert(!text.includes('広告と関連記事'), 'aside が混入しています');
    });

    test('文章分割で句点なしの末尾と長文チャンクを扱う', () => {
      const sentences = api.splitIntoSentences('一文目です。二文目です! 最後は句点なし');
      assert(sentences.length === 3, `文章数が期待と違います: ${sentences.length}`);
      assert(sentences[2] === '最後は句点なし', '句点なし末尾が保持されていません');

      const longSentences = api.splitIntoSentences('あ'.repeat(305));
      assert(longSentences.length === 4, '長文が100文字単位に分割されていません');
    });

    test('複数ノードにまたがる文章をハイライトできる', () => {
      setFixture('<article><p>これは<strong>複数ノード</strong>にまたがる文章です。</p></article>');
      api.highlightSentence('これは複数ノードにまたがる文章です。');
      const highlight = document.getElementById('voicevox-reader-current');
      assert(highlight, 'ハイライト要素が作成されていません');
      assert(compact(highlight.textContent).includes('これは複数ノードにまたがる文章です'), 'ハイライト範囲が期待と違います');
      api.removeHighlight();
      assert(!document.getElementById('voicevox-reader-current'), 'ハイライトが削除されていません');
    });

    test('ハイライト解除後もリンクなどの内部マークアップを保持する', () => {
      setFixture('<article><p>詳しくは<a href="https://example.com" id="vr-link">こちらのリンク</a>を参照してください。</p></article>');
      api.highlightSentence('詳しくはこちらのリンクを参照してください。');
      assert(document.getElementById('voicevox-reader-current'), 'ハイライト要素が作成されていません');

      api.removeHighlight();
      const link = document.getElementById('vr-link');
      assert(link, 'ハイライト解除後にリンク要素が失われています');
      assert(link.tagName === 'A' && link.getAttribute('href') === 'https://example.com', 'リンクの属性が保持されていません');
      assert(compact(fixture.textContent).includes('詳しくはこちらのリンクを参照してください'), '本文テキストが壊れています');
      assert(!document.getElementById('voicevox-reader-current'), 'ハイライトが削除されていません');
    });

    test('ページ読み上げフローがモック音声で最後まで進む', async () => {
      setFixture(`
        <article>
          <p>最初の文です。次の文です。</p>
          <p>最後の文です。</p>
        </article>
      `);

      const spoken = [];
      window.__statusMessages = [];
      api.setSynthesizeSpeechOverride(async (text) => {
        spoken.push(text);
        return new ArrayBuffer(8);
      });
      api.setPlayAudioOverride(async () => 'ended');

      await api.startReading();
      const state = api.getState();
      assert(!state.isPlaying && !state.isPaused, '読み上げ完了後に停止状態になっていません');
      assert(spoken.length === 3, `読み上げ文数が期待と違います: ${spoken.length}`);
      assert(spoken[0] === '最初の文です。', '最初の文が読み上げられていません');
      assert(window.__statusMessages.some(message => message.currentIndex === 1 && message.totalSentences === 3), '2文目のインデックス通知がありません');
      assert(window.__statusMessages.some(message => message.currentIndex === 2 && message.totalSentences === 3), '3文目のインデックス通知がありません');
    });

    test('VOICEVOX未起動時はダイアログではなくページ内通知で知らせる', async () => {
      setFixture('<article><p>読み上げ対象の本文です。</p></article>');
      window.__voicevoxAvailable = false;

      // window.alert / window.confirm はフックで例外になるため、呼ばれればここで失敗する
      await api.startReading();

      const notice = document.getElementById('voicevox-reader-notice');
      assert(notice, 'ページ内通知が表示されていません');
      assert(notice.textContent.includes('VOICEVOXが起動していません'), `通知の文言が期待と違います: ${notice.textContent}`);
      assert(notice.querySelector('.vr-notice-close'), '通知に閉じるボタンがありません');

      const state = api.getState();
      assert(!state.isPlaying, 'VOICEVOX未起動なのに再生状態になっています');

      notice.querySelector('.vr-notice-close').click();
      assert(!document.getElementById('voicevox-reader-notice'), '閉じるボタンで通知が消えていません');
    });

    test('保存済みの再生設定を合成前に取り込む', async () => {
      setFixture('<article><p>設定反映のテストです。次の文もあります。</p></article>');
      window.__storedSettings = { floatingPanelEnabled: false, speakerId: 5, speed: 1.5, volume: 40 };

      const usedSpeeds = [];
      api.setSynthesizeSpeechOverride(async () => new ArrayBuffer(8));
      api.setPlayAudioOverride(async (audioData, synthesisSpeed) => {
        usedSpeeds.push(synthesisSpeed);
        return 'ended';
      });

      await api.startReading();

      const state = api.getState();
      assert(state.speakerId === 5, `話者IDが反映されていません: ${state.speakerId}`);
      assert(state.speed === 1.5, `再生速度が反映されていません: ${state.speed}`);
      assert(state.volume === 0.4, `音量が0〜1へ正規化されていません: ${state.volume}`);
      assert(usedSpeeds.length > 0, '音声が再生されていません');
      assert(usedSpeeds.every(value => value === 1.5), `合成に使われた速度が期待と違います: ${usedSpeeds.join(', ')}`);
    });

    test('再生中の設定変更を storage の変更通知で取り込む', () => {
      setFixture('<article><p>変更通知のテストです。</p></article>');
      assert(window.__storageListeners.length > 0, 'storage の変更リスナーが登録されていません');

      const notify = (changes, areaName) => {
        window.__storageListeners.forEach(listener => listener(changes, areaName));
      };

      notify({
        speakerId: { newValue: 8 },
        speed: { newValue: 0.75 },
        volume: { newValue: 20 }
      }, 'local');

      const state = api.getState();
      assert(state.speakerId === 8, `話者IDが反映されていません: ${state.speakerId}`);
      assert(state.speed === 0.75, `再生速度が反映されていません: ${state.speed}`);
      assert(state.volume === 0.2, `音量が反映されていません: ${state.volume}`);

      // local 以外の領域の変更は取り込まない
      notify({ volume: { newValue: 100 } }, 'sync');
      assert(api.getState().volume === 0.2, 'local 以外の領域の変更を取り込んでいます');
    });

    test('選択範囲を「範囲」とみなすか「開始位置」とみなすか判定する', () => {
      const spans = api.spansMultipleSentences;
      assert(spans('二つ目の文です。三つ目の文です。') === true, '複数の文をまたぐ選択を範囲と判定していません');
      assert(spans('段落その一\n段落その二') === true, '改行をまたぐ選択を範囲と判定していません');
      assert(spans('Hello. World.') === true, '半角の文区切りを判定できていません');
      assert(spans('これは一文です。') === false, '1文だけの選択を範囲と誤判定しています');
      assert(spans('途中まで選んだ') === false, '終端記号のない選択を範囲と誤判定しています');
      assert(spans('VOICEVOX 0.25.1 を使う') === false, '小数点を文の区切りと誤判定しています');
    });

    test('複数の文にまたがる選択は、その範囲だけを読み上げて停止する', async () => {
      setFixture(`
        <article>
          <p id="p1">最初の文です。次の文です。</p>
          <p id="p2">選択した文その一です。選択した文その二です。</p>
          <p id="p3">最後の文です。</p>
        </article>
      `);

      const spoken = [];
      api.setSynthesizeSpeechOverride(async (text) => { spoken.push(text); return new ArrayBuffer(8); });
      api.setPlayAudioOverride(async () => 'ended');

      const range = document.createRange();
      range.selectNodeContents(document.getElementById('p2'));
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);

      await api.startReading();

      assert(spoken.length === 2, `選択範囲の外まで読み上げています: ${spoken.length}文`);
      assert(spoken[0] === '選択した文その一です。', `1文目が期待と違います: ${spoken[0]}`);
      assert(spoken[1] === '選択した文その二です。', `2文目が期待と違います: ${spoken[1]}`);
      assert(document.getElementById('voicevox-reader-notice'), '範囲指定であることの通知が出ていません');
    });

    test('1文の途中までの選択は、そこから最後まで読み上げる', async () => {
      setFixture(`
        <article>
          <p id="q1">最初の文です。次の文です。</p>
          <p id="q2">選択した文その一です。選択した文その二です。</p>
          <p id="q3">最後の文です。</p>
        </article>
      `);

      const spoken = [];
      api.setSynthesizeSpeechOverride(async (text) => { spoken.push(text); return new ArrayBuffer(8); });
      api.setPlayAudioOverride(async () => 'ended');

      const textNode = document.getElementById('q2').firstChild;
      const range = document.createRange();
      range.setStart(textNode, 0);
      range.setEnd(textNode, 9);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);

      await api.startReading();

      assert(spoken.length === 3, `選択位置から最後まで読み上げていません: ${spoken.length}文`);
      assert(spoken[0] === '選択した文その一です。', `開始位置が期待と違います: ${spoken[0]}`);
      assert(spoken[2] === '最後の文です。', `末尾まで読み上げていません: ${spoken[2]}`);
      assert(!document.getElementById('voicevox-reader-notice'), '開始位置指定なのに範囲指定の通知が出ています');
    });

    test('selectionOnly を指定すると、短い選択でも範囲だけを読み上げる', async () => {
      setFixture(`
        <article>
          <p id="r1">最初の文です。次の文です。</p>
          <p id="r2">選択した文その一です。選択した文その二です。</p>
        </article>
      `);

      const spoken = [];
      api.setSynthesizeSpeechOverride(async (text) => { spoken.push(text); return new ArrayBuffer(8); });
      api.setPlayAudioOverride(async () => 'ended');

      // 文の区切りをまたがない選択。自動判定なら「開始位置」になる長さ
      const textNode = document.getElementById('r2').firstChild;
      const range = document.createRange();
      range.setStart(textNode, 0);
      range.setEnd(textNode, 8);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);

      await api.startReading({ selectionOnly: true });

      assert(spoken.length === 1, `選択範囲の外まで読み上げています: ${spoken.length}文`);
      assert(spoken[0] === '選択した文その一', `読み上げ内容が期待と違います: ${spoken[0]}`);
      assert(!document.getElementById('voicevox-reader-notice'), 'メニュー経由では不要な通知が出ています');
    });

    test('selectionOnly で選択がないときは通知して何も読み上げない', async () => {
      setFixture('<article><p>選択していない本文です。</p></article>');

      const spoken = [];
      api.setSynthesizeSpeechOverride(async (text) => { spoken.push(text); return new ArrayBuffer(8); });
      api.setPlayAudioOverride(async () => 'ended');

      await api.startReading({ selectionOnly: true });

      assert(spoken.length === 0, `選択がないのに読み上げています: ${spoken.length}文`);
      const notice = document.getElementById('voicevox-reader-notice');
      assert(notice, '選択がないことの通知が出ていません');
      assert(notice.textContent.includes('選択されていません'), `通知の文言が期待と違います: ${notice.textContent}`);
      assert(!api.getState().isPlaying, '再生状態になっています');
    });

    test('フローティングパネルの閉じるボタンは読み上げ中は使えない', async () => {
      setFixture('<article><p>閉じるボタンのテストです。</p></article>');
      api.showFloatingPanel();

      const panel = document.getElementById('voicevox-reader-floating-panel');
      assert(panel, 'フローティングパネルが表示されていません');
      const closeBtn = panel.querySelector('.vr-panel-close');
      assert(closeBtn, '閉じるボタンがありません');
      assert(!closeBtn.disabled, '停止中なのに閉じるボタンが無効です');

      // 再生中の状態を、playAudio が呼ばれた瞬間に捕まえる
      let disabledWhilePlaying = null;
      api.setSynthesizeSpeechOverride(async () => new ArrayBuffer(8));
      api.setPlayAudioOverride(async () => {
        disabledWhilePlaying = closeBtn.disabled;
        return 'ended';
      });

      await api.startReading();

      assert(disabledWhilePlaying === true, '読み上げ中に閉じるボタンが無効になっていません');
      assert(!closeBtn.disabled, '読み上げ終了後に閉じるボタンが有効へ戻っていません');
    });

    test('閉じるボタンでパネルを閉じる。設定は持たない', () => {
      setFixture('<article><p>閉じる操作のテストです。</p></article>');
      window.__storedSettings = { floatingPanelEnabled: false };
      api.showFloatingPanel();

      const panel = document.getElementById('voicevox-reader-floating-panel');
      assert(panel, 'フローティングパネルが表示されていません');

      panel.querySelector('.vr-panel-close').click();

      assert(!document.getElementById('voicevox-reader-floating-panel'), 'パネルが閉じていません');
      assert(!('floatingPanelEnabled' in window.__storedSettings) ||
        window.__storedSettings.floatingPanelEnabled === false,
        'パネルの表示状態を storage へ書いています（状態を持たない設計に反します）');
    });

    test('表示中に再度表示しても二重にならない', () => {
      setFixture('<article><p>二重表示のテストです。</p></article>');
      api.showFloatingPanel();
      api.showFloatingPanel();

      const panels = document.querySelectorAll('#voicevox-reader-floating-panel');
      assert(panels.length === 1, `パネルが ${panels.length} 個あります`);
    });

    test('右クリック読み上げでは操作パネルを自動表示する', async () => {
      setFixture('<article><p id="s1">右クリック読み上げのテストです。</p></article>');
      assert(!document.getElementById('voicevox-reader-floating-panel'), '前提としてパネルは非表示のはずです');

      api.setSynthesizeSpeechOverride(async () => new ArrayBuffer(8));
      api.setPlayAudioOverride(async () => 'ended');

      const textNode = document.getElementById('s1').firstChild;
      const range = document.createRange();
      range.setStart(textNode, 0);
      range.setEnd(textNode, 10);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);

      // background から playSelection を受け取ったときと同じ経路を通す
      api.showFloatingPanel();
      await api.startReading({ selectionOnly: true });

      assert(document.getElementById('voicevox-reader-floating-panel'), '操作パネルが表示されていません');
    });

    test('読み上げ開始時に他タブの停止を要求し、状態通知は1通にまとめる', async () => {
      setFixture('<article><p>単一タブ読み上げのテストです。</p></article>');
      api.setSynthesizeSpeechOverride(async () => new ArrayBuffer(8));
      api.setPlayAudioOverride(async () => 'ended');
      window.__sentActions = [];

      await api.startReading();

      assert(window.__sentActions.includes('claimPlayback'), '他タブの停止を要求していません');
      assert(window.__sentActions.includes('statusUpdate'), '状態通知が送られていません');
      assert(!window.__sentActions.includes('updateIcon'),
        'updateIcon が残っています（statusUpdate と二重になります）');
    });

    // 一時停止・再開の窓口を差し替えて、制御側の動きだけを取り出して確かめる。
    // 「その場で止められたか」を方式が返し、制御側はそれに従うだけ、という約束事の検証。
    function useFakeSpeaker({ canPause }) {
      const calls = [];
      let releaseFirst = null;
      let firstPending = true;

      api.setSpeaker({
        async ensureReady() { return true; },
        speak(text) {
          calls.push(`speak:${text}`);
          if (firstPending) {
            firstPending = false;
            return new Promise(resolve => { releaseFirst = resolve; });
          }
          return Promise.resolve('ended');
        },
        pause() { calls.push('pause'); return canPause; },
        resume() { calls.push('resume'); return canPause; },
        stop() { calls.push('stop'); },
        applySettings() {}
      });

      return { calls, finishFirst: () => releaseFirst && releaseFirst('ended') };
    }

    test('その場で止められたときは、再開しても同じ文を読み直さない', async () => {
      setFixture('<article><p id="pz">一時停止の確認です。次の文です。</p></article>');
      const fake = useFakeSpeaker({ canPause: true });

      const reading = api.startReading();
      await new Promise(resolve => setTimeout(resolve, 20));

      const firstSpoken = fake.calls[0];
      api.pauseReading();
      api.resumeReading();
      fake.finishFirst();
      await reading;

      assert(fake.calls[1] === 'pause' && fake.calls[2] === 'resume',
        `一時停止と再開が窓口へ伝わっていません: ${fake.calls.join(' / ')}`);
      const repeated = fake.calls.filter(c => c === firstSpoken).length;
      assert(repeated === 1, `同じ文を読み直しています: ${fake.calls.join(' / ')}`);
    });

    test('その場で止められないときは、再開時に現在の文を読み直す', async () => {
      setFixture('<article><p id="pz">一時停止の確認です。次の文です。</p></article>');
      const fake = useFakeSpeaker({ canPause: false });

      const reading = api.startReading();
      await new Promise(resolve => setTimeout(resolve, 20));

      const firstSpoken = fake.calls[0];
      api.pauseReading();
      api.resumeReading();
      await new Promise(resolve => setTimeout(resolve, 20));
      fake.finishFirst();
      await reading;

      const repeated = fake.calls.filter(c => c === firstSpoken).length;
      assert(repeated === 2, `現在の文を読み直していません: ${fake.calls.join(' / ')}`);
    });

    test('voice の指定で読み上げ方式が切り替わる', () => {
      setFixture('<article><p>方式切り替えのテストです。</p></article>');
      const notify = (changes) => {
        window.__storageListeners.forEach(listener => listener(changes, 'local'));
      };

      notify({ voice: { newValue: 'system:Microsoft Zira' } });
      let state = api.getState();
      assert(state.voice.engine === 'system', `OS標準が選ばれていません: ${JSON.stringify(state.voice)}`);
      assert(state.voice.id === 'Microsoft Zira', `声の識別子が違います: ${state.voice.id}`);

      notify({ voice: { newValue: 'voicevox:8' } });
      state = api.getState();
      assert(state.voice.engine === 'voicevox', `VOICEVOX が選ばれていません: ${JSON.stringify(state.voice)}`);
      assert(state.speakerId === 8, `話者IDが反映されていません: ${state.speakerId}`);
    });

    test('OS標準の声を選ぶと、VOICEVOX の合成を使わずに読み上げる', async () => {
      setFixture('<article><p>標準音声のテストです。</p></article>');
      window.__storedSettings = { voice: 'system:TestVoice', speed: 1, volume: 100 };
      window.__systemSpoken = [];

      let voicevoxUsed = false;
      api.setSynthesizeSpeechOverride(async () => { voicevoxUsed = true; return new ArrayBuffer(8); });
      api.setPlayAudioOverride(async () => 'ended');

      await api.startReading();

      assert(window.__systemSpoken.length > 0, 'OS標準の音声で読み上げていません');
      assert(!voicevoxUsed, 'OS標準を選んだのに VOICEVOX の合成を呼んでいます');
    });

    test('voice が無い古い設定は VOICEVOX の指定として読む', async () => {
      setFixture('<article><p>互換性のテストです。</p></article>');
      window.__storedSettings = { speakerId: 5, speed: 1, volume: 100 };

      api.setSynthesizeSpeechOverride(async () => new ArrayBuffer(8));
      api.setPlayAudioOverride(async () => 'ended');
      await api.startReading();

      const state = api.getState();
      assert(state.voice.engine === 'voicevox', `VOICEVOX として扱われていません: ${JSON.stringify(state.voice)}`);
      assert(state.speakerId === 5, `話者IDが引き継がれていません: ${state.speakerId}`);
    });

    (async () => {
      const lines = [];
      for (const item of tests) {
        try {
          await item.fn();
          lines.push(`PASS ${item.name}`);
        } catch (error) {
          lines.push(`FAIL ${item.name}: ${error.message}`);
        }
      }

      const failed = lines.some(line => line.startsWith('FAIL'));
      result.textContent = `${failed ? 'FAIL' : 'PASS'}\n${lines.join('\n')}`;
      document.documentElement.dataset.testStatus = failed ? 'fail' : 'pass';
    })();
  </script>
